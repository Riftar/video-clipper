<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self' 'unsafe-inline' data: blob:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' data: https://fonts.googleapis.com; img-src 'self' data: blob: https:; media-src 'self' blob: file:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https:;" />
  <title>Clipper</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ────────────────────────── SIDEBAR ────────────────────────── -->
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark"><span class="material-symbols-outlined">movie_edit</span></div>
      <div>
        <div class="brand-name">Clipper</div>
        <div class="brand-sub" id="brand-version">v0.2.0</div>
      </div>
    </div>

    <nav class="nav">
      <button class="nav-item active" data-target="page-downloader">
        <span class="material-symbols-outlined">download</span> <span data-nav="downloader">Downloader</span>
      </button>
      <button class="nav-item" data-target="page-studio">
        <span class="material-symbols-outlined">content_cut</span> <span data-nav="studio">Studio</span>
      </button>
      <button class="nav-item" data-target="page-export">
        <span class="material-symbols-outlined">ios_share</span> <span data-nav="export">Export</span>
      </button>
      <button class="nav-item" data-target="page-license">
        <span class="material-symbols-outlined">key</span> <span data-nav="license">License</span>
      </button>
    </nav>

    <div class="sidebar-foot">
      <div class="foot-line">
        <span class="material-symbols-outlined">cloud_off</span> <span id="user-badge">offline</span>
      </div>
      <div class="foot-line truncate" id="workspace-path" title="">workspace</div>
    </div>
  </aside>

  <!-- ────────────────────────── MAIN ───────────────────────────── -->
  <main class="main">
    <section class="page active" id="page-downloader"></section>
    <section class="page" id="page-studio"></section>
    <section class="page" id="page-export"></section>
    <section class="page" id="page-license"></section>
  </main>

  <!-- Toast container -->
  <div id="toast-host"></div>

  <script src="i18n.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
